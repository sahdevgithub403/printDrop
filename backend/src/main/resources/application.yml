server:
  port: ${PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: printalfa-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/printalfa}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # No default password — must be provided via env (fail-fast in prod via RequiredEnvValidator).
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Safe default: never auto-migrate schema in prod. Dev profile below overrides to `update`.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # Mail is disabled by default (no host). Set MAIL_HOST/MAIL_PORT + APP_MAIL_ENABLED=true to enable.
    # NOTE (handoff to backend agent): EmailService should consult `app.mail.enabled`
    # and skip sending (log only) when false; currently it branches on profile/mailSender.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  jwt:
    # No default secret — must be provided via env (fail-fast in prod via RequiredEnvValidator).
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
  cors:
    # No default origins — must be provided via env in prod.
    # Required prod origins, e.g.: https://<admin-app>.vercel.app,https://<customer-app>.vercel.app
    # (consumed by SecurityConfig/WebSocketConfig — code change owned by backend agent, skipped here)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  customer-url: ${APP_CUSTOMER_URL:}
  mail:
    # Feature flag for EmailService (handoff: backend agent to consume; false = log-only, no SMTP).
    enabled: ${APP_MAIL_ENABLED:false}

razorpay:
  # No defaults — must be provided via env (fail-fast in prod via RequiredEnvValidator).
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev
  # DEV-ONLY localhost conveniences (never active in prod). The default profile
  # has no such fallbacks and fails fast via RequiredEnvValidator.
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  # DEV-ONLY convenience secret for local development. Never use outside localhost.
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-local-secret-not-for-prod-0123456789abcdef}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
  customer-url: ${APP_CUSTOMER_URL:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:printalfadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: root123
    password: root123
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

app:
  jwt:
    # TEST-ONLY literal: placeholders (${VAR:default}) resolve to empty when the
    # gitignored local .env defines the key but blank, so the test profile pins a
    # literal instead. Never use outside tests.
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175

razorpay:
  # TEST-ONLY literals (same placeholder-blanking rationale as above). The C-02
  # fail-closed guard is relaxed ONLY under the test profile: order ids are minted
  # locally (order_test_*) with no network, and verification still HMAC-checks.
  key-id: rzp_test_dummy
  key-secret: dummy_secret
  webhook-secret: dummy_webhook_secret
